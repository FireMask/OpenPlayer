<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPlayer</title>
<style>
  :root { --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --accent: #2563eb; --warn: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --card: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --accent: #60a5fa; --warn: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .status { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-height: 96px; }
  .state { color: var(--muted); font-size: .9rem; }
  .title { font-size: 1.2rem; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
  .artist { color: var(--muted); overflow-wrap: anywhere; }
  .offline { color: var(--warn); font-weight: 600; }
  .progress { margin-top: 12px; }
  .progress input { width: 100%; margin: 0; accent-color: var(--accent); }
  .time { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: right; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid button { background: var(--card); color: var(--text); border: 0; border-radius: 12px; padding: 16px 8px;
           font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
           min-height: 88px; touch-action: manipulation; }
  .grid button .icon { font-size: 1.8rem; line-height: 1; }
  .grid button .label { font-size: .8rem; color: var(--muted); }
  .grid button:active { outline: 2px solid var(--accent); }
  .grid button.primary .icon { color: var(--accent); }

  /* Pestañas, biblioteca y listas (SPEC 10) */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--card); border-radius: 12px; padding: 4px; }
  .tabs button { flex: 1; border: 0; border-radius: 8px; padding: 10px 4px; background: none; color: var(--muted);
                 font: inherit; cursor: pointer; touch-action: manipulation; }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--text); font-weight: 600; }
  .bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .bar input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px;
               border: 1px solid var(--muted); background: var(--card); color: var(--text); }
  .small { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--card); color: var(--text);
           font: inherit; cursor: pointer; touch-action: manipulation; }
  .small:active { outline: 2px solid var(--accent); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-bottom: 8px; color: var(--muted); }
  .crumbs button { border: 0; background: none; color: var(--accent); font: inherit; padding: 4px; cursor: pointer; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 12px; overflow: hidden; }
  .list li { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--bg); }
  .list li:first-child { border-top: 0; }
  .list .main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; color: var(--text);
                font: inherit; padding: 10px 12px; cursor: pointer; }
  .list .name { display: block; overflow-wrap: anywhere; }
  .list .meta { display: block; color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
  .list .act { border: 0; background: none; color: var(--accent); font-size: 1.2rem; padding: 10px; cursor: pointer;
               min-width: 44px; touch-action: manipulation; }
  .empty { color: var(--muted); padding: 12px; }
  .msg { min-height: 1.4em; margin: 8px 0; color: var(--muted); }
  .msg.error { color: var(--warn); font-weight: 600; }
  .more { width: 100%; margin-top: 8px; }
  dialog { border: 0; border-radius: 12px; background: var(--card); color: var(--text); width: min(360px, 90vw); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h2 { font-size: 1rem; margin: 0 0 8px; }
  dialog .list { background: var(--bg); max-height: 50vh; overflow-y: auto; margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <h1>OpenPlayer</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="player" aria-selected="true">Reproductor</button>
    <button role="tab" data-tab="library" aria-selected="false">Biblioteca</button>
    <button role="tab" data-tab="lists" aria-selected="false">Listas</button>
  </nav>
  <div id="tab-player">
  <section class="status" aria-live="polite">
    <div class="state" id="state">Cargando…</div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="progress" id="progress" hidden>
      <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Posición">
      <div class="time" id="time"></div>
    </div>
  </section>
  <div class="grid">
    <button data-button="previous"><span class="icon">⏮</span><span class="label">Anterior</span></button>
    <button data-button="play_pause" class="primary"><span class="icon">⏯</span><span class="label">Play / Pausa</span></button>
    <button data-button="next"><span class="icon">⏭</span><span class="label">Siguiente</span></button>
    <button data-button="volume_down"><span class="icon">🔉</span><span class="label">Bajar volumen</span></button>
    <button data-button="menu"><span class="icon">☰</span><span class="label">Menú</span></button>
    <button data-button="volume_up"><span class="icon">🔊</span><span class="label">Subir volumen</span></button>
    <button data-button="refresh_library"><span class="icon">🔄</span><span class="label">Actualizar biblioteca</span></button>
  </div>
  </div>

  <div id="tab-library" hidden>
    <form class="bar" id="lib-search">
      <input type="search" id="lib-query" placeholder="Buscar título, artista, álbum…" minlength="2" maxlength="100"
             aria-label="Buscar">
      <button class="small" type="submit">Buscar</button>
    </form>
    <div class="crumbs" id="lib-crumbs"></div>
    <p class="msg" id="lib-msg" aria-live="polite"></p>
    <ul class="list" id="lib-list"></ul>
    <button class="small more" id="lib-more" hidden>Más</button>
  </div>

  <div id="tab-lists" hidden>
    <div class="bar" id="lists-index-bar">
      <button class="small" id="lists-new">＋ Nueva lista</button>
    </div>
    <div class="bar" id="list-bar" hidden>
      <button class="small" id="list-back">← Listas</button>
      <button class="small" id="list-play">▶ Reproducir</button>
    </div>
    <div class="crumbs" id="list-title" hidden></div>
    <p class="msg" id="lists-msg" aria-live="polite"></p>
    <ul class="list" id="lists-list"></ul>
    <button class="small more" id="lists-more" hidden>Más</button>
  </div>

  <dialog id="picker">
    <h2>Agregar a una lista</h2>
    <ul class="list" id="picker-list"></ul>
    <button class="small" id="picker-cancel">Cancelar</button>
  </dialog>
</main>
<script>
  const STATES = { playing: "Reproduciendo", paused: "En pausa", stopped: "Detenido" };
  const $ = id => document.getElementById(id);

  // Posición del último sondeo (s) y cuándo llegó; entre sondeos se extrapola si playing.
  let base = 0, baseAt = 0, duration = 0, playing = false, dragging = false;

  const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
  const estimate = () => Math.min(duration, playing ? base + (performance.now() - baseAt) / 1000 : base);

  function renderProgress() {
    if (!duration) return;
    const t = dragging ? Number($("seek").value) : estimate();
    if (!dragging) $("seek").value = Math.floor(t);
    $("time").textContent = `${mmss(t)} / ${mmss(duration)}`;
  }

  function showProgress(s) {
    const was = playing ? estimate() : null;
    duration = s.durationSeconds || 0;
    playing = s.state === "playing";
    $("progress").hidden = !duration;
    $("seek").disabled = s.state === "stopped";
    if (!duration) return;
    $("seek").max = duration;
    // El snapshot trunca a segundos: si queda < 1 s detrás de lo extrapolado, se conserva para no saltar atrás.
    const pos = s.positionSeconds || 0;
    const behind = was == null ? -1 : was - pos;
    base = playing && behind >= 0 && behind < 1 ? was : pos;
    baseAt = performance.now();
    renderProgress();
  }

  function showOffline() {
    $("state").className = "state offline";
    $("state").textContent = "Sin conexión con el reproductor";
    $("title").textContent = "";
    $("artist").textContent = "";
    $("progress").hidden = true;
    duration = 0;
  }

  // textContent, nunca innerHTML: título y artista vienen de los archivos de música.
  function show(s) {
    const volume = s.volume == null ? "" : ` · Volumen ${s.volume}%`;
    $("state").className = "state";
    $("state").textContent = (STATES[s.state] || s.state) + volume;
    $("title").textContent = s.trackTitle || (s.state === "stopped" ? "" : "Sin título");
    $("artist").textContent = s.trackArtist || "";
    showProgress(s);
  }

  async function refresh() {
    try {
      const r = await fetch("/api/snapshot", { cache: "no-store" });
      if (r.ok) show(await r.json()); else showOffline();
    } catch { showOffline(); }
  }

  document.querySelectorAll(".grid button[data-button]").forEach(b => b.addEventListener("click", async () => {
    try {
      const r = await fetch("/api/buttons/" + b.dataset.button, { method: "POST" });
      if (r.status === 503) return showOffline();
    } catch { return showOffline(); }
    refresh();
  }));

  // Mientras se arrastra, el sondeo no mueve la barra; el seek se envía solo al soltar (change).
  $("seek").addEventListener("input", () => { dragging = true; renderProgress(); });
  $("seek").addEventListener("change", async () => {
    const seconds = Number($("seek").value);
    dragging = false;
    base = seconds;
    baseAt = performance.now();
    renderProgress();
    try {
      const r = await fetch("/api/seek", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ positionSeconds: seconds }),
      });
      if (r.status === 503) return showOffline();
    } catch { return showOffline(); }
    refresh();
  });

  refresh();
  setInterval(refresh, 2000);
  setInterval(renderProgress, 250);

  // --- Biblioteca y listas (SPEC 10). Todo texto de MPD se inserta con textContent. ---

  const OFFLINE = "Sin conexión con el reproductor";
  const enc = encodeURIComponent;

  // Devuelve el JSON de la respuesta (null en 204); lanza Error con un mensaje para mostrar.
  async function api(method, url, body) {
    let r;
    try {
      r = await fetch(url, {
        method, cache: "no-store",
        headers: body === undefined ? {} : { "Content-Type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
    } catch { throw new Error(OFFLINE); }
    if (r.status === 204) return null;
    if (r.ok) return r.json();
    if (r.status === 503) throw new Error(OFFLINE);
    if (r.status === 502) {
      const e = await r.json().catch(() => null);
      throw new Error(e && e.message ? e.message : "El reproductor devolvió un error");
    }
    throw new Error(r.status === 400 ? "Pedido inválido" : `Error ${r.status}`);
  }

  function setMsg(id, text, isError = false) {
    $(id).textContent = text;
    $(id).className = isError ? "msg error" : "msg";
  }

  const baseName = uri => uri.split("/").pop();

  function el(tag, props = {}, ...children) {
    const e = document.createElement(tag);
    Object.assign(e, props);
    e.append(...children);
    return e;
  }

  // Fila: botón principal (nombre + detalle) y botones de acción [{ text, label, onClick }].
  function row(name, meta, onClick, actions = []) {
    const main = el("button", { className: "main", onclick: onClick },
      el("span", { className: "name", textContent: name }));
    if (meta) main.append(el("span", { className: "meta", textContent: meta }));
    return el("li", {}, main, ...actions.map(a =>
      el("button", { className: "act", textContent: a.text, title: a.label, ariaLabel: a.label, onclick: a.onClick })));
  }

  function trackMeta(e) {
    const parts = [e.artist, e.album].filter(Boolean);
    if (e.durationSeconds != null) parts.push(mmss(e.durationSeconds));
    return parts.join(" · ");
  }

  // Pestañas: la de Reproductor no cambia; Biblioteca carga al abrirla por primera vez.
  const tabs = document.querySelectorAll(".tabs button");
  const loaders = { library: () => loadLibrary(), lists: () => showIndex() };
  const loaded = new Set(["player"]);
  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(o => {
      o.setAttribute("aria-selected", String(o === t));
      $("tab-" + o.dataset.tab).hidden = o !== t;
    });
    if (!loaded.has(t.dataset.tab)) { loaded.add(t.dataset.tab); loaders[t.dataset.tab](); }
  }));

  // Biblioteca: carpeta actual (libPath) o búsqueda (libQuery), paginado de 100 con "Más".
  let libPath = "", libQuery = null, libNext = 0;

  function renderCrumbs() {
    const c = $("lib-crumbs");
    c.replaceChildren();
    if (libQuery !== null) {
      c.append(el("span", { textContent: `Resultados de “${libQuery}”` }),
        el("button", { textContent: "✕ Volver", onclick: () => { libQuery = null; $("lib-query").value = ""; loadLibrary(); } }));
      return;
    }
    const parts = libPath ? libPath.split("/") : [];
    c.append(el("button", { textContent: "Música", onclick: () => openFolder("") }));
    parts.forEach((p, i) => {
      c.append("/", el("button", { textContent: p, onclick: () => openFolder(parts.slice(0, i + 1).join("/")) }));
    });
  }

  function openFolder(path) {
    libPath = path;
    libQuery = null;
    loadLibrary();
  }

  async function loadLibrary(append = false) {
    const offset = append ? libNext : 0;
    const url = libQuery !== null
      ? `/api/library/search?q=${enc(libQuery)}&offset=${offset}`
      : `/api/library?path=${enc(libPath)}&offset=${offset}`;
    if (!append) renderCrumbs();
    setMsg("lib-msg", "Cargando…");
    let page;
    try { page = await api("GET", url); } catch (e) { return setMsg("lib-msg", e.message, true); }
    setMsg("lib-msg", "");
    const list = $("lib-list");
    if (!append) list.replaceChildren();
    for (const e of page.entries) {
      const add = { text: "+", label: "Agregar a una lista", onClick: () => pickPlaylist(e.uri) };
      list.append(e.directory
        ? row("📁 " + baseName(e.uri), "", () => openFolder(e.uri), [add])
        : row(e.title || baseName(e.uri), trackMeta(e), () => playTrack(e), [add]));
    }
    if (!list.children.length)
      list.append(el("li", { className: "empty", textContent: libQuery !== null ? "Sin resultados" : "Carpeta vacía" }));
    libNext = page.offset + page.entries.length;
    $("lib-more").hidden = libNext >= page.total;
  }

  async function playTrack(e) {
    try {
      await api("POST", "/api/library/play", { uri: e.uri });
      setMsg("lib-msg", "Reproduciendo " + (e.title || baseName(e.uri)));
    } catch (err) { return setMsg("lib-msg", err.message, true); }
    refresh();
  }

  $("lib-more").addEventListener("click", () => loadLibrary(true));
  $("lib-search").addEventListener("submit", ev => {
    ev.preventDefault();
    const q = $("lib-query").value.trim();
    if (q.length < 2) return setMsg("lib-msg", "Escribe al menos 2 caracteres", true);
    libQuery = q;
    loadLibrary();
  });

  // Selector de lista para "+": pista o carpeta (MPD expande la carpeta).
  async function pickPlaylist(uri) {
    let data;
    try { data = await api("GET", "/api/playlists"); } catch (e) { return setMsg("lib-msg", e.message, true); }
    const list = $("picker-list");
    list.replaceChildren();
    for (const name of data.playlists) {
      list.append(row(name, "", async () => {
        $("picker").close();
        try {
          await api("POST", `/api/playlists/${enc(name)}/tracks`, { uri });
          setMsg("lib-msg", `Agregado a “${name}”`);
        } catch (e) { setMsg("lib-msg", e.message, true); }
      }));
    }
    if (!data.playlists.length)
      list.append(el("li", { className: "empty", textContent: "No hay listas. Crea una en la pestaña Listas." }));
    $("picker").showModal();
  }

  $("picker-cancel").addEventListener("click", () => $("picker").close());

  // Listas: índice (crear, renombrar, borrar) o una lista abierta (reproducir, ↑/↓/✕).
  let openList = null, listCount = 0, listTotal = 0;
  const listUrl = name => "/api/playlists/" + enc(name);
  const listsMsg = (text, isError) => setMsg("lists-msg", text, isError);

  function showView(name) {
    openList = name;
    $("lists-index-bar").hidden = name !== null;
    $("list-bar").hidden = $("list-title").hidden = name === null;
    $("list-title").textContent = name || "";
    $("lists-more").hidden = true;
  }

  async function showIndex(message = "") {
    showView(null);
    listsMsg("Cargando…");
    let data;
    try { data = await api("GET", "/api/playlists"); } catch (e) { return listsMsg(e.message, true); }
    listsMsg(message);
    const list = $("lists-list");
    list.replaceChildren(...data.playlists.map(name => row(name, "", () => openPlaylist(name), [
      { text: "✎", label: "Renombrar", onClick: () => renamePlaylist(name) },
      { text: "🗑", label: "Borrar", onClick: () => deletePlaylist(name) },
    ])));
    if (!data.playlists.length) list.append(el("li", { className: "empty", textContent: "No hay listas" }));
  }

  // Ejecuta una mutación; si falla muestra el mensaje y devuelve false.
  async function mutate(method, url, body) {
    try { await api(method, url, body); return true; } catch (e) { listsMsg(e.message, true); return false; }
  }

  $("lists-new").addEventListener("click", async () => {
    const name = prompt("Nombre de la nueva lista");
    if (!name || !name.trim()) return;
    if (await mutate("POST", "/api/playlists", { name: name.trim() })) showIndex(`Lista “${name.trim()}” creada`);
  });

  async function renamePlaylist(name) {
    const newName = prompt("Nuevo nombre", name);
    if (!newName || !newName.trim() || newName.trim() === name) return;
    if (await mutate("POST", listUrl(name) + "/rename", { newName: newName.trim() })) showIndex("Lista renombrada");
  }

  async function deletePlaylist(name) {
    if (!confirm(`¿Borrar la lista “${name}”? La música no se borra.`)) return;
    if (await mutate("DELETE", listUrl(name))) showIndex(`Lista “${name}” borrada`);
  }

  function openPlaylist(name) {
    showView(name);
    $("lists-list").replaceChildren();
    listCount = 0;
    loadPlaylist();
  }

  // Carga la página siguiente; reload vuelve a pedir desde 0 tantas pistas como había (tras ↑/↓/✕).
  async function loadPlaylist(reload = false) {
    const name = openList;
    const want = reload ? Math.max(listCount, 1) : listCount + 1;
    let offset = reload ? 0 : listCount;
    const tracks = [];
    listsMsg("Cargando…");
    try {
      do {
        const page = await api("GET", `${listUrl(name)}?offset=${offset}`);
        tracks.push(...page.entries);
        listTotal = page.total;
        offset = page.offset + page.entries.length;
        if (!page.entries.length) break;
      } while (reload && offset < Math.min(want, listTotal));
    } catch (e) { return listsMsg(e.message, true); }
    if (name !== openList) return;  // el usuario volvió al índice mientras cargaba
    listsMsg("");
    const list = $("lists-list");
    if (reload) { list.replaceChildren(); listCount = 0; }
    tracks.forEach((e, i) => list.append(trackRow(e, listCount + i)));
    listCount += tracks.length;
    if (!listCount) list.append(el("li", { className: "empty", textContent: "Lista vacía. Agrega música desde Biblioteca." }));
    $("lists-more").hidden = listCount >= listTotal;
  }

  function trackRow(e, pos) {
    const r = row(`${pos + 1}. ${e.title || baseName(e.uri)}`, trackMeta(e), () => playPlaylist(pos), [
      { text: "↑", label: "Subir", onClick: () => moveTrack(pos, pos - 1) },
      { text: "↓", label: "Bajar", onClick: () => moveTrack(pos, pos + 1) },
      { text: "✕", label: "Quitar", onClick: () => removeTrack(pos) },
    ]);
    const [, up, down] = r.querySelectorAll("button");
    up.disabled = pos === 0;
    down.disabled = pos === listTotal - 1;
    return r;
  }

  async function moveTrack(from, to) {
    if (await mutate("POST", listUrl(openList) + "/move", { from, to })) loadPlaylist(true);
  }

  async function removeTrack(pos) {
    if (await mutate("DELETE", `${listUrl(openList)}/tracks/${pos}`)) loadPlaylist(true);
  }

  async function playPlaylist(position) {
    if (!(await mutate("POST", listUrl(openList) + "/play", { position }))) return;
    listsMsg(`Reproduciendo “${openList}”`);
    refresh();
  }

  $("list-back").addEventListener("click", () => showIndex());
  $("list-play").addEventListener("click", () => playPlaylist(0));
  $("lists-more").addEventListener("click", () => loadPlaylist());
</script>
</body>
</html>
